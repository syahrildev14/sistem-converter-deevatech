# Nginx reverse proxy untuk Office Media Converter — di belakang Cloudflare (proxied / awan oranye)
#
# Prasyarat (lihat README bagian "Deploy"):
#   - Cloudflare SSL/TLS mode: Full (strict)
#   - Cloudflare Origin Certificate tersimpan di:
#       /etc/ssl/cloudflare/converter.deevatech.my.id.pem
#       /etc/ssl/cloudflare/converter.deevatech.my.id.key
#   - /etc/nginx/conf.d/cloudflare-realip.conf dibuat dengan deploy/nginx/update-cloudflare-ips.sh
#
# Pasang:
#   sudo cp converter.deevatech.my.id.conf /etc/nginx/sites-available/
#   sudo ln -s /etc/nginx/sites-available/converter.deevatech.my.id.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name converter.deevatech.my.id;
    return 301 https://$host$request_uri;
}

server {
    # "ssl http2" kompatibel dengan Nginx lama (Ubuntu 22.04 = 1.18) maupun baru.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name converter.deevatech.my.id;

    ssl_certificate     /etc/ssl/cloudflare/converter.deevatech.my.id.pem;
    ssl_certificate_key /etc/ssl/cloudflare/converter.deevatech.my.id.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Cloudflare (paket Free/Pro) menolak body > 100 MB; nilai ini sedikit di atas MAX_UPLOAD_MB.
    client_max_body_size 100m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        # $remote_addr sudah berisi IP asli pengunjung berkat cloudflare-realip.conf
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;

        # Upload di-stream langsung ke aplikasi, download hasil langsung di-stream.
        proxy_request_buffering off;
        proxy_buffering off;

        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        send_timeout 300s;
    }
}
