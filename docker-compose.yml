services:
  converter:
    build:
      context: .
      args:
        YTDLP_VERSION: ${YTDLP_VERSION:-latest}
    image: office-media-converter:latest
    container_name: office-media-converter
    restart: unless-stopped
    init: true # reaps ffmpeg / yt-dlp child processes
    ports:
      # Default hanya localhost: akses publik lewat reverse proxy HTTPS (Nginx). Set HOST_BIND=0.0.0.0 bila tanpa proxy.
      - "${HOST_BIND:-127.0.0.1}:${HOST_PORT:-3000}:3000"
    environment:
      # --- access ---
      ACCESS_PIN: ${ACCESS_PIN:-}
      AUTH_SECRET: ${AUTH_SECRET:-}
      SESSION_HOURS: ${SESSION_HOURS:-12}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      # --- limits & cleanup ---
      FILE_TTL_MINUTES: ${FILE_TTL_MINUTES:-30}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-500}
      MAX_DURATION_MINUTES: ${MAX_DURATION_MINUTES:-180}
      MAX_CONCURRENT_JOBS: ${MAX_CONCURRENT_JOBS:-2}
      MAX_QUEUED_JOBS: ${MAX_QUEUED_JOBS:-20}
      JOB_TIMEOUT_MINUTES: ${JOB_TIMEOUT_MINUTES:-30}
      # --- speed tuning ---
      FFMPEG_THREADS: ${FFMPEG_THREADS:-}
      VIDEO_PRESET: ${VIDEO_PRESET:-veryfast}
      MAX_VIDEO_HEIGHT: ${MAX_VIDEO_HEIGHT:-720}
      MP3_ALGORITHM_QUALITY: ${MP3_ALGORITHM_QUALITY:-5}
      # --- URL source ---
      ENABLE_URL_SOURCE: ${ENABLE_URL_SOURCE:-true}
      ALLOWED_URL_HOSTS: ${ALLOWED_URL_HOSTS:-}
      ALLOW_PRIVATE_URLS: ${ALLOW_PRIVATE_URLS:-false}
      YTDLP_AUTO_UPDATE: ${YTDLP_AUTO_UPDATE:-false}
      YTDLP_COOKIES_FILE: ${YTDLP_COOKIES_FILE:-}
      # --- fixed inside the container ---
      STORAGE_DIR: /data/media
    volumes:
      - media-data:/data
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    stop_grace_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  media-data:
